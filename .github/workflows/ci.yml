# Every push and pull request to main runs the same gates as locally:
# server integration tests, client lint + build, client unit tests, and the
# Playwright end-to-end flows. No job uses a secret: the tests run on an
# in-memory MongoDB and never read MONGODB_URI or GROQ_API_KEY.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless, so that one is
# cancelled. A push to main gets a group of its own (its commit), so it is never
# cancelled or left pending behind a later one: every commit that lands on main
# gets its own result, and one that broke main shows red, not "cancelled" by the
# fix pushed right after it. (Sharing the branch's group without cancelling
# would not do: GitHub still drops a pending run when a newer one queues.)
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  # mongodb-memory-server downloads mongod (in its postinstall, which
  # allowScripts approves) to ~/.cache/mongodb-binaries rather than
  # node_modules/.cache, which `npm ci` wipes. That is its default; it is
  # spelled out because the cache steps below depend on that path. The cache
  # key is the lockfile, which pins the mongod version.
  MONGOMS_PREFER_GLOBAL_PATH: '1'

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - run: npm ci
      - run: npm test

  client-lint-build:
    name: Client lint + build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # The build only bakes the URL in; nothing calls it here.
          VITE_API_URL: https://api.example.invalid/api

  client-unit:
    name: Client unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: End-to-end flows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      # The e2e API runs server/app.js, so it needs the server's dependencies.
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - name: Cache Playwright's browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      # Downloads Chromium unless the cache already has it; the system
      # libraries it needs are installed either way.
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e
        working-directory: client
      # Kept after every run that finished, not only a failed one: a flow that
      # fails once and passes on its retry leaves the job green, and the trace
      # of the failed attempt is the only evidence of an intermittent bug.
      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7
