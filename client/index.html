    <title>Quran Tracker — memorize the Quran, page by page</title>

    <!-- Icons: an SVG for browsers that take one, a PNG for those that don't, and a
         solid tile for home screens (which must not be transparent). -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- How a shared link looks. Absolute URLs, because most scrapers will not
         resolve a relative one; change the origin here if the site moves. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quran Tracker" />
    <meta property="og:title" content="Quran Tracker — memorize the Quran, page by page" />
